[project]
name = "tessera"
version = "0.1.0"
description = "Variant prioritization and evidence engine for perturbational screens"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6",
    "duckdb>=1.0",
    "polars>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "vcrpy>=6"]

[project.scripts]
tessera = "tessera.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
